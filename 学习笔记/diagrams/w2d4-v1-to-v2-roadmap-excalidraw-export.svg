<svg xmlns="http://www.w3.org/2000/svg" width="1436" height="784" viewBox="0 0 1436 784">
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#1e1e1e"/></marker></defs>
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <text x="48" y="48" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="600" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="48" dy="0">W2D4：从 v1 到 W2D5 的演进</tspan></text>
  <rect x="48" y="196" width="240" height="100" rx="16" ry="16" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="168" y="246" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="168" dy="0">W2D4 v1</tspan><tspan x="168" dy="30">能输入</tspan><tspan x="168" dy="30">能处理</tspan><tspan x="168" dy="30">能输出</tspan></text>
  <rect x="388" y="96" width="260" height="100" rx="16" ry="16" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
  <text x="518" y="146" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="518" dy="0">异常处理</tspan><tspan x="518" dy="30">空输入</tspan><tspan x="518" dy="30">模型失败</tspan><tspan x="518" dy="30">超时提示</tspan></text>
  <rect x="388" y="296" width="260" height="100" rx="16" ry="16" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
  <text x="518" y="346" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="518" dy="0">参数配置</tspan><tspan x="518" dy="30">模型名</tspan><tspan x="518" dy="30">温度</tspan><tspan x="518" dy="30">系统提示词</tspan></text>
  <rect x="758" y="196" width="260" height="100" rx="16" ry="16" fill="#d9f0ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="888" y="246" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="888" dy="0">W2D5 样例测试</tspan><tspan x="888" dy="30">5 到 10 组输入</tspan><tspan x="888" dy="30">对比输出质量</tspan></text>
  <rect x="1128" y="196" width="260" height="100" rx="16" ry="16" fill="#ffe8cc" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1258" y="246" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1258" dy="0">W2D6 README</tspan><tspan x="1258" dy="30">说明场景、输入输出、运行方式</tspan></text>
  <path d="M 288 246 L 388 146" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="338" y="172" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="338" dy="0">补稳定性</tspan></text>
  <path d="M 288 246 L 388 346" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="338" y="272" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="338" dy="0">补可配置</tspan></text>
  <path d="M 648 156 L 758 246" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="703" y="181" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="703" dy="0">验证错误场景</tspan></text>
  <path d="M 648 336 L 758 246" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="703" y="271" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="703" dy="0">比较配置差异</tspan></text>
  <path d="M 1018 246 L 1128 246" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="1073" y="222" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1073" dy="0">整理成果</tspan></text>
  <text x="58" y="696" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="58" dy="0">W2D4 不是孤立的一天，它是 Week 2 真正开始“做应用”的起点。</tspan></text>
  <text x="58" y="736" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="58" dy="0">v1 的标准很朴素：能跑通；v2 的标准才是更稳、更可配、更能展示。</tspan></text>
</svg>
