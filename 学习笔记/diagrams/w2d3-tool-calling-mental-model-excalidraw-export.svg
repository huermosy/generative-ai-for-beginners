  <text x="58" y="696" text-anchor="start" dominant-baseline="hanging" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="58" dy="0">关键记忆：模型不直接执行函数；模型负责选择工具并生成参数，应用负责执行。</tspan></text>
