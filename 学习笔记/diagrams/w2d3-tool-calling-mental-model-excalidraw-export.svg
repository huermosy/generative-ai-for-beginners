<svg xmlns="http://www.w3.org/2000/svg" width="1776" height="744" viewBox="0 0 1776 744">
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#1e1e1e"/></marker></defs>
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <text x="48" y="48" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="600" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="48" dy="0">W2D3：函数调用心智模型</tspan></text>
  <rect x="48" y="196" width="240" height="100" rx="16" ry="16" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="168" y="246" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="168" dy="0">用户</tspan><tspan x="168" dy="30">自然语言目标</tspan></text>
  <rect x="368" y="196" width="260" height="100" rx="16" ry="16" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text x="498" y="246" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="498" dy="0">模型</tspan><tspan x="498" dy="30">理解意图</tspan></text>
  <polygon points="838,181 958,246 838,311 718,246" fill="#fff0f6" stroke="#1e1e1e" stroke-width="2"/>
  <text x="838" y="246" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="838" dy="0">要不要调用工具？</tspan></text>
  <rect x="1058" y="196" width="300" height="100" rx="16" ry="16" fill="#e6fcf5" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1208" y="246" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1208" dy="0">模型输出</tspan><tspan x="1208" dy="30">工具名 + 参数 JSON</tspan></text>
  <rect x="368" y="426" width="260" height="120" rx="16" ry="16" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="498" y="486" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="498" dy="0">工具说明</tspan><tspan x="498" dy="30">name + description</tspan><tspan x="498" dy="30">parameters</tspan></text>
  <rect x="1058" y="426" width="300" height="100" rx="16" ry="16" fill="#ffe8cc" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1208" y="476" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1208" dy="0">应用代码</tspan><tspan x="1208" dy="30">真正执行函数</tspan></text>
  <rect x="1448" y="426" width="280" height="100" rx="16" ry="16" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1588" y="476" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1588" dy="0">模型整合结果</tspan><tspan x="1588" dy="30">回答用户</tspan></text>
  <path d="M 288 246 L 368 246" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="328" y="224" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="328" dy="0">提出需求</tspan></text>
  <path d="M 498 426 L 498 296" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="576" y="351" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="576" dy="0">给模型可用工具</tspan></text>
  <path d="M 628 246 L 718 246" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="673" y="224" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="673" dy="0">判断</tspan></text>
  <path d="M 958 246 L 1058 246" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="1008" y="224" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1008" dy="0">需要时生成参数</tspan></text>
  <path d="M 1208 296 L 1208 426" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="1288" y="353" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1288" dy="0">交给应用执行</tspan></text>
  <path d="M 1358 476 L 1448 476" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="1403" y="454" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1403" dy="0">工具结果回填</tspan></text>
  <text x="58" y="696" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="58" dy="0">关键记忆：模型不直接执行函数；模型负责选择工具并生成参数，应用负责执行。</tspan></text>
</svg>
