  <g fill="#2d2d2d" font-family="Virgil, Segoe Print, Comic Sans MS, cursive">
    <text x="600" y="66" text-anchor="middle" font-size="34" font-weight="700">W2D2 图 2：Prompt 模板长什么样</text>

    <text x="360" y="198" text-anchor="middle" font-size="30" font-weight="700">1. 角色</text>
    <text x="360" y="234" text-anchor="middle" font-size="22">你是谁</text>

    <text x="360" y="334" text-anchor="middle" font-size="30" font-weight="700">2. 任务</text>
    <text x="360" y="370" text-anchor="middle" font-size="22">这次具体要做什么</text>

    <text x="360" y="470" text-anchor="middle" font-size="30" font-weight="700">3. 用户背景</text>
    <text x="360" y="506" text-anchor="middle" font-size="22">答案是给谁看的</text>

    <text x="360" y="606" text-anchor="middle" font-size="30" font-weight="700">4. 上下文资料</text>
    <text x="360" y="642" text-anchor="middle" font-size="22">模型依赖的材料</text>

    <text x="360" y="740" text-anchor="middle" font-size="30" font-weight="700">5. 输出要求</text>
    <text x="360" y="772" text-anchor="middle" font-size="22">格式 + 限制条件</text>

    <text x="840" y="274" text-anchor="middle" font-size="34" font-weight="700">模板化 Prompt</text>
    <text x="840" y="320" text-anchor="middle" font-size="24">把稳定部分固定下来</text>
    <text x="840" y="356" text-anchor="middle" font-size="24">把变化部分做成变量</text>
    <text x="840" y="392" text-anchor="middle" font-size="24">同类任务可以反复复用</text>

    <text x="836" y="602" text-anchor="middle" font-size="32" font-weight="700">结果</text>
    <text x="836" y="638" text-anchor="middle" font-size="22">更稳定</text>
    <text x="836" y="666" text-anchor="middle" font-size="22">更贴题</text>
    <text x="836" y="694" text-anchor="middle" font-size="22">更容易持续优化</text>
