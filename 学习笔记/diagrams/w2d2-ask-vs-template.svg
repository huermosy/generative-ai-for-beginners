  <g fill="#2d2d2d" font-family="Virgil, Segoe Print, Comic Sans MS, cursive">
    <text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700">W2D2 图 3：普通提问 vs 模板化提问</text>

    <text x="326" y="198" text-anchor="middle" font-size="32" font-weight="700">普通提问</text>
    <text x="326" y="244" text-anchor="middle" font-size="24">“请解释什么是 Prompt 模板”</text>
    <text x="326" y="302" text-anchor="middle" font-size="24">优点：快</text>
    <text x="326" y="336" text-anchor="middle" font-size="24">缺点：范围太宽</text>
    <text x="326" y="370" text-anchor="middle" font-size="24">不知道给谁讲</text>
    <text x="326" y="404" text-anchor="middle" font-size="24">不知道输出要多长</text>
    <text x="326" y="438" text-anchor="middle" font-size="24">不知道用什么结构</text>
    <text x="326" y="494" text-anchor="middle" font-size="28" font-weight="700">结果：回答容易飘</text>

    <text x="876" y="198" text-anchor="middle" font-size="32" font-weight="700">模板化提问</text>
    <text x="876" y="244" text-anchor="middle" font-size="24">角色 + 任务 + 用户背景</text>
    <text x="876" y="278" text-anchor="middle" font-size="24">上下文 + 输出格式 + 限制条件</text>
    <text x="876" y="336" text-anchor="middle" font-size="24">知道在回答谁</text>
    <text x="876" y="370" text-anchor="middle" font-size="24">知道要回答到什么深度</text>
    <text x="876" y="404" text-anchor="middle" font-size="24">知道结果该长什么样</text>
    <text x="876" y="438" text-anchor="middle" font-size="24">知道边界和重点</text>
    <text x="876" y="494" text-anchor="middle" font-size="28" font-weight="700">结果：回答更稳、更贴题</text>

    <text x="600" y="580" text-anchor="middle" font-size="26" font-weight="700">真正的提升，不在“更会提问”，而在“更会给约束”。</text>
  </g>
</svg>
