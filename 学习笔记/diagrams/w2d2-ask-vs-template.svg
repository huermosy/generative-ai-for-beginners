    <path d="M132 154 C250 126, 446 126, 520 154"/>
    <path d="M130 156 C118 226, 120 438, 136 522"/>
    <path d="M520 154 C534 226, 534 438, 518 522"/>
    <path d="M136 522 C256 546, 396 546, 518 520"/>

    <path d="M682 154 C806 126, 1006 126, 1070 154"/>
    <path d="M680 156 C668 226, 670 438, 686 522"/>
