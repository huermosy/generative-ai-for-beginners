  <rect x="818" y="166" width="280" height="110" rx="12" ry="12" fill="#e6fcf5" stroke="#1e1e1e" stroke-width="2"/>
  <text x="958" y="221" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="958" dy="0">模型生成参数</tspan><tspan x="958" dy="30">{ role, product, level }</tspan></text>
  <rect x="1198" y="166" width="260" height="110" rx="12" ry="12" fill="#ffe8cc" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1328" y="221" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="1328" dy="0">search_courses()</tspan><tspan x="1328" dy="30">查询课程数据</tspan></text>
  <rect x="1558" y="166" width="270" height="110" rx="12" ry="12" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1693" y="221" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="1693" dy="0">工具结果</tspan><tspan x="1693" dy="30">课程列表 JSON</tspan></text>
  <rect x="1558" y="356" width="270" height="100" rx="12" ry="12" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1693" y="406" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="1693" dy="0">最终回答</tspan><tspan x="1693" dy="30">人类可读推荐</tspan></text>
