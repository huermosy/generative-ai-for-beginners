  <text x="58" y="696" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="58" dy="0">函数调用的价值不是“更聪明”，而是把自然语言转成应用可以执行的结构化契约。</tspan></text>
