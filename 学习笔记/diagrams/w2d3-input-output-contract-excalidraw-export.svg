<svg xmlns="http://www.w3.org/2000/svg" width="1876" height="744" viewBox="0 0 1876 744">
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#1e1e1e"/></marker></defs>
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <text x="48" y="48" text-anchor="start" dominant-baseline="hanging" font-family="Segoe Print, Comic Sans MS, cursive" font-size="36" fill="#1e1e1e"><tspan x="48" dy="0">W2D3：输入输出契约</tspan></text>
  <rect x="58" y="166" width="260" height="100" rx="12" ry="12" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="188" y="216" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="188" dy="0">用户输入</tspan><tspan x="188" dy="30">“帮我找适合初学者的 Azure 课程”</tspan></text>
