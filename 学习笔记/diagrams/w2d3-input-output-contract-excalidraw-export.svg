  <path d="M 568 216 L 958 221" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="763" y="194.5" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" fill="#1e1e1e"><tspan x="763" dy="0">约束输出</tspan></text>
  <path d="M 958 221 L 1328 221" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="1143" y="197" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" fill="#1e1e1e"><tspan x="1143" dy="0">传参</tspan></text>
  <path d="M 1328 221 L 1693 221" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="1510.5" y="197" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" fill="#1e1e1e"><tspan x="1510.5" dy="0">返回数据</tspan></text>
  <path d="M 1693 221 L 1693 406" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="1693" y="289.5" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" fill="#1e1e1e"><tspan x="1693" dy="0">再交给模型组织语言</tspan></text>
  <text x="58" y="696" text-anchor="start" dominant-baseline="hanging" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="58" dy="0">函数调用的价值不是“更聪明”，而是把自然语言转成应用能处理的结构化契约。</tspan></text>
