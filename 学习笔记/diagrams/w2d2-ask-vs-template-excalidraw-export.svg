<svg xmlns="http://www.w3.org/2000/svg" width="986" height="657" viewBox="0 0 986 657">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <text x="273" y="48" text-anchor="middle" dominant-baseline="hanging" font-family="Segoe Print, Comic Sans MS, cursive" font-size="36" fill="#1e1e1e"><tspan x="273" dy="0">W2D2：普通提问 vs 模板化提问</tspan></text>
  <rect x="48" y="174" width="330" height="340" rx="12" ry="12" fill="#ffe3e3" stroke="#1e1e1e" stroke-width="2"/>
  <text x="213" y="239" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="213" dy="0">普通提问</tspan><tspan x="213" dy="30"></tspan><tspan x="213" dy="30">请解释 Prompt 模板</tspan><tspan x="213" dy="30"></tspan><tspan x="213" dy="30">优点：快</tspan><tspan x="213" dy="30">问题：容易泛</tspan><tspan x="213" dy="30">问题：格式不稳</tspan><tspan x="213" dy="30">问题：不方便复用</tspan></text>
  <rect x="608" y="174" width="330" height="340" rx="12" ry="12" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="773" y="224" text-anchor="middle" dominant-baseline="middle" font-family="Segoe Print, Comic Sans MS, cursive" font-size="24" fill="#1e1e1e"><tspan x="773" dy="0">模板化提问</tspan><tspan x="773" dy="30"></tspan><tspan x="773" dy="30">角色 + 任务</tspan><tspan x="773" dy="30">用户背景 + 上下文</tspan><tspan x="773" dy="30">输出格式 + 约束</tspan><tspan x="773" dy="30"></tspan><tspan x="773" dy="30">结果：更稳定</tspan><tspan x="773" dy="30">结果：更贴题</tspan><tspan x="773" dy="30">结果：可复用</tspan></text>
  <path d="M 398 344 L 588 344" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="493" y="318" text-anchor="middle" dominant-baseline="hanging" font-family="Segoe Print, Comic Sans MS, cursive" font-size="18" fill="#1e1e1e"><tspan x="493" dy="0">加结构</tspan></text>
  <text x="238" y="599" text-anchor="start" dominant-baseline="hanging" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" fill="#1e1e1e"><tspan x="238" dy="0">普通提问适合探索；模板化提问适合做工具和产品。</tspan></text>
</svg>
