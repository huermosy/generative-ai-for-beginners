  <rect x="1378" y="106" width="260" height="100" rx="16" ry="16" fill="#ffe8cc" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1508" y="156" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1508" dy="0">先追问</tspan><tspan x="1508" dy="30">不要瞎填参数</tspan></text>
  <rect x="1378" y="326" width="260" height="100" rx="16" ry="16" fill="#e6fcf5" stroke="#1e1e1e" stroke-width="2"/>
  <text x="1508" y="376" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1508" dy="0">执行工具</tspan><tspan x="1508" dy="30">处理错误和空结果</tspan></text>
  <rect x="1728" y="216" width="280" height="100" rx="16" ry="16" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
