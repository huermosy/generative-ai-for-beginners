  <path d="M 1638 156 L 1678 156 L 1678 244 L 1728 244" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <path d="M 1638 376 L 1678 376 L 1678 288 L 1728 288" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="58" y="696" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="58" dy="0">好工具不是参数越多越强，而是边界清楚、输入可验证、失败可解释。</tspan></text>
