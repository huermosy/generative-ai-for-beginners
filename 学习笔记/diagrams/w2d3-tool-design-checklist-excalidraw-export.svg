  <rect x="688" y="206" width="280" height="100" rx="16" ry="16" fill="#f3f0ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="828" y="256" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="828" dy="0">参数设计</tspan><tspan x="828" dy="30">少而明确，可验证</tspan></text>
  <polygon points="1173,186 1288,256 1173,326 1058,256" fill="#fff0f6" stroke="#1e1e1e" stroke-width="2"/>
