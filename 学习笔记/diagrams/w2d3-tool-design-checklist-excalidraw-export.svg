<svg xmlns="http://www.w3.org/2000/svg" width="2056" height="744" viewBox="0 0 2056 744">
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#1e1e1e"/></marker></defs>
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <text x="48" y="48" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="600" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="48" dy="0">W2D3：工具设计检查清单</tspan></text>
  <rect x="48" y="206" width="260" height="100" rx="16" ry="16" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="2"/>
