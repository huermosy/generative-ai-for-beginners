  <text x="1318" y="183" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="1318" dy="0">不够</tspan></text>
  <path d="M 1288 256 L 1328 256 L 1328 376 L 1378 376" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
