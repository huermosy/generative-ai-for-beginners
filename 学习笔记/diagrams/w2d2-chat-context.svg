  <g fill="#2d2d2d" font-family="Virgil, Segoe Print, Comic Sans MS, cursive">
    <text x="600" y="64" text-anchor="middle" font-size="34" font-weight="700">W2D2 图 4：聊天应用里的上下文管理</text>

    <text x="366" y="194" text-anchor="middle" font-size="32" font-weight="700">原始历史消息</text>
    <text x="350" y="240" text-anchor="middle" font-size="22">第 1 轮：自我介绍</text>
    <text x="350" y="274" text-anchor="middle" font-size="22">第 2 轮：问别的话题</text>
    <text x="350" y="360" text-anchor="middle" font-size="22">第 3 轮：回到当前任务</text>
    <text x="350" y="394" text-anchor="middle" font-size="22">第 4 轮：补了一些背景</text>
    <text x="350" y="480" text-anchor="middle" font-size="22">第 5 轮：夹杂无关闲聊</text>
    <text x="350" y="514" text-anchor="middle" font-size="22">第 6 轮：真正的问题来了</text>

    <text x="884" y="204" text-anchor="middle" font-size="32" font-weight="700">保留“相关的”上下文</text>
    <text x="884" y="256" text-anchor="middle" font-size="22">保留：</text>
    <text x="884" y="292" text-anchor="middle" font-size="22">当前任务目标</text>
    <text x="884" y="326" text-anchor="middle" font-size="22">用户水平与偏好</text>
    <text x="884" y="360" text-anchor="middle" font-size="22">最近几轮关键约束</text>
    <text x="884" y="412" text-anchor="middle" font-size="22">删掉或压缩：</text>
    <text x="884" y="446" text-anchor="middle" font-size="22">无关闲聊</text>
    <text x="884" y="480" text-anchor="middle" font-size="22">过旧信息</text>
    <text x="884" y="514" text-anchor="middle" font-size="22">重复信息</text>

    <text x="600" y="590" text-anchor="middle" font-size="26" font-weight="700">上下文管理不是“全保留”，而是“保留当前任务真正需要的”。</text>
