<svg xmlns="http://www.w3.org/2000/svg" width="1116" height="784" viewBox="0 0 1116 784">
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#1e1e1e"/></marker></defs>
  <rect width="100%" height="100%" fill="#fffdf8"/>
  <text x="48" y="48" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="600" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="48" dy="0">W2D4：Check-in 提示词契约</tspan></text>
  <rect x="48" y="166" width="260" height="110" rx="16" ry="16" fill="#d9f0ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="178" y="221" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="178" dy="0">System</tspan><tspan x="178" dy="30">你是一名中文 AI 学习教练</tspan></text>
  <rect x="388" y="106" width="300" height="230" rx="16" ry="16" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
  <text x="448" y="221" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="448" dy="0">输入槽位</tspan><tspan x="448" dy="30">- 学习者背景</tspan><tspan x="448" dy="30">- 今日任务</tspan><tspan x="448" dy="30">- 关联仓库章节</tspan><tspan x="448" dy="30">- 当前进度</tspan><tspan x="448" dy="30">- 用户提问</tspan></text>
  <rect x="768" y="106" width="300" height="230" rx="16" ry="16" fill="#e9fac8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="848" y="221" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="848" dy="0">输出结构</tspan><tspan x="848" dy="30">1. 今天关键点</tspan><tspan x="848" dy="30">2. 最小练习</tspan><tspan x="848" dy="30">3. 下一步建议</tspan><tspan x="848" dy="30">4. 风险提醒</tspan></text>
  <rect x="388" y="396" width="300" height="110" rx="16" ry="16" fill="#ffe8cc" stroke="#1e1e1e" stroke-width="2"/>
  <text x="538" y="451" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="538" dy="0">User message</tspan><tspan x="538" dy="30">例如：我今天该先看哪段代码？</tspan></text>
  <rect x="768" y="396" width="300" height="110" rx="16" ry="16" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="918" y="451" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="918" dy="0">Reply</tspan><tspan x="918" dy="30">适合初学者、结构稳定、可执行</tspan></text>
  <path d="M 308 221 L 388 221" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="348" y="197" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="348" dy="0">定义角色与口吻</tspan></text>
  <path d="M 688 221 L 768 221" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="728" y="197" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="728" dy="0">形成完整提示</tspan></text>
  <path d="M 538 396 L 918 336" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="728" y="346" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="728" dy="0">补变量</tspan></text>
  <path d="M 918 336 L 918 396" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)"/>
  <text x="918" y="346" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="918" dy="0">约束输出</tspan></text>
  <text x="58" y="696" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="58" dy="0">W2D4 的 Prompt 不该只是“随便问一句”，而要把 W2D2 的模板意识真正落进应用代码里。</tspan></text>
  <text x="58" y="736" text-anchor="start" dominant-baseline="hanging" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#1e1e1e" paint-order="stroke" stroke="#fffdf8" stroke-width="6" stroke-linejoin="round"><tspan x="58" dy="0">先把输出结构固定下来，后面接 Notion、函数调用和测试都会轻松很多。</tspan></text>
</svg>
