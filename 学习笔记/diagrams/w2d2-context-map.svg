  <g fill="#2d2d2d" font-family="Virgil, Segoe Print, Comic Sans MS, cursive">
    <text x="600" y="70" text-anchor="middle" font-size="34" font-weight="700">W2D2 图 1：上下文到底是什么</text>
    <text x="600" y="286" text-anchor="middle" font-size="38" font-weight="700">上下文</text>
    <text x="600" y="328" text-anchor="middle" font-size="24">模型回答前，你补充给它的背景信息</text>
    <text x="600" y="362" text-anchor="middle" font-size="24">不是多说几句，而是给“判断方向”</text>

    <text x="314" y="208" text-anchor="middle" font-size="30" font-weight="700">任务上下文</text>
    <text x="314" y="246" text-anchor="middle" font-size="22">这次要做什么</text>
    <text x="314" y="280" text-anchor="middle" font-size="22">总结 / 解释 / 出题 / 写代码</text>

    <text x="884" y="208" text-anchor="middle" font-size="30" font-weight="700">用户上下文</text>
    <text x="884" y="246" text-anchor="middle" font-size="22">答案是给谁看的</text>
    <text x="884" y="280" text-anchor="middle" font-size="22">初学者 / 专家 / 中文 / 面试导向</text>

    <text x="314" y="470" text-anchor="middle" font-size="30" font-weight="700">资料上下文</text>
    <text x="314" y="508" text-anchor="middle" font-size="22">模型回答要依赖什么材料</text>
    <text x="314" y="542" text-anchor="middle" font-size="22">文章 / 规则 / README / 产品清单</text>

    <text x="884" y="470" text-anchor="middle" font-size="30" font-weight="700">对话上下文</text>
    <text x="884" y="508" text-anchor="middle" font-size="22">前面几轮已经聊过什么</text>
    <text x="884" y="542" text-anchor="middle" font-size="22">当前问题是在延续哪个主题</text>

    <text x="600" y="692" text-anchor="middle" font-size="26" font-weight="700">一句话记忆：没有上下文，模型只能泛泛地猜；有了上下文，模型才能更精准地收敛。</text>
