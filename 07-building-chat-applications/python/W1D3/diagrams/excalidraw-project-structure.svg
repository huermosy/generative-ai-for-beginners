      <text x="32" y="96" font-size="17">Routes, API key loading, model calls, JSON responses.</text>
      <text x="32" y="132" font-size="16" fill="#475569">Owned by app.py</text>
    </g>

    <g transform="translate(690 388)">
      <path d="M6 8 C88 0, 323 0, 423 8 C441 10, 452 22, 454 40 C460 87, 459 131, 451 173 C448 190, 435 201, 418 202 C308 208, 104 206, 23 199 C8 198, 0 184, 2 166 C-3 120, -1 49, 6 8Z" fill="#dbeafe" stroke="#111827" stroke-width="2.4"/>
      <text x="32" y="56" font-size="24" font-weight="700">Frontend responsibility</text>
      <text x="32" y="96" font-size="17">Chat UI, input handling, fetch(), rendering bubbles.</text>
      <text x="32" y="132" font-size="16" fill="#475569">Owned by templates/index.html</text>
    </g>

    <path d="M574 257 C608 241, 643 235, 687 249" fill="none" stroke="#111827" stroke-width="2.4" marker-end="url(#arrow)"/>
    <path d="M574 475 C609 492, 643 496, 687 489" fill="none" stroke="#111827" stroke-width="2.4" marker-end="url(#arrow)"/>
