<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="W1D3 project structure">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#fffdf7"/>
  <g font-family="Virgil, Segoe Print, Comic Sans MS, sans-serif" fill="#1f2937">
    <text x="70" y="72" font-size="34" font-weight="700">Project Structure and Responsibilities</text>
    <text x="72" y="106" font-size="18" fill="#64748b">A small folder, but each file has a clear job.</text>

    <g transform="translate(90 156)">
      <path d="M8 8 C112 0, 370 0, 482 8 C500 9, 512 24, 514 42 C522 169, 520 384, 510 502 C508 522, 492 535, 473 537 C356 545, 112 543, 24 536 C8 534, 0 519, 2 499 C-4 364, -3 143, 8 8Z" fill="#f8fafc" stroke="#111827" stroke-width="2.4"/>
