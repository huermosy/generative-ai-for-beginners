    <g transform="translate(690 160)">
      <path d="M6 8 C88 0, 323 0, 423 8 C441 10, 452 22, 454 40 C460 87, 459 131, 451 173 C448 190, 435 201, 418 202 C308 208, 104 206, 23 199 C8 198, 0 184, 2 166 C-3 120, -1 49, 6 8Z" fill="#dcfce7" stroke="#111827" stroke-width="2.4"/>
