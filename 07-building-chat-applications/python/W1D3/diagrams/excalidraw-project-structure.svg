      <text x="62" y="105" font-size="22">app.py</text>
      <text x="62" y="160" font-size="22">README.md</text>
      <text x="62" y="215" font-size="22">TECHNICAL_DETAILS.md</text>
      <text x="62" y="270" font-size="22">templates/</text>
      <text x="100" y="318" font-size="22">index.html</text>
      <text x="62" y="373" font-size="22">diagrams/</text>
      <text x="100" y="421" font-size="20">excalidraw-*.svg</text>
